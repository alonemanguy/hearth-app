name: Feature request
description: Suggest something Hearth should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Hearth makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: A rough idea is enough. You do not need to design it.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
    validations:
      required: false
